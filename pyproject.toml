[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brieflet"
version = "0.2.0"
description = "Personal daily briefing of news and papers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "feedparser>=6.0.14",
    "streamlit>=1.59.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1"
]

[project.scripts]
brieflet = "brieflet.script:main"

[tool.pytest.ini_options]
testpaths = ["tests"]